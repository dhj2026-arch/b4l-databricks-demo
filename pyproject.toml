[project]
name = "b4l-databricks-demo"
version = "0.1.0"
description = "B4L Fondation Smart Badminton Center - Databricks demo"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
app = ["streamlit>=1.38", "plotly>=5.22", "databricks-sdk>=0.40", "databricks-sql-connector>=3.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
src = ["src"]
